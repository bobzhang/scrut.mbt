name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: C compiler (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch the package registry
        run: moon update

      - name: Check
        run: moon check --target native --deny-warn

      - name: Unit and oracle tests
        run: moon test --target native

      - name: Self-tests (scrut testing scrut)
        shell: bash
        run: sh scripts/selftest.sh

      - name: The wasm build (as moonx runs it)
        shell: bash
        run: |
          moon build --target wasm --release
          PATH="$PWD/_build/native/release/build/cmd/scrut-testbin:$PATH"
          moonrun _build/wasm/release/build/cmd/scrut/scrut.wasm -- test \
            tests/fixtures/pass.md tests/fixtures/variables.md \
            tests/fixtures/grammar.md tests/fixtures/cram.t tests/moonx.md
